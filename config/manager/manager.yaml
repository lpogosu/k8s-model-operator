apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    app.kubernetes.io/name: k8s-model-operator
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-model-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-model-operator
    spec:
      serviceAccountName: controller-manager
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      containers:
        - name: manager
          image: ghcr.io/lpogosu/k8s-model-operator:dev
          args:
            # Two replicas with leader election: the standby takes over on a node
            # failure without two managers ever writing to the same object.
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              # Memory only. A CPU limit would throttle the reconcile loop on an
              # otherwise idle node for no gain; requests already share it fairly.
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
