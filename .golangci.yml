version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - goconst
    - misspell
    - nilerr
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - whitespace
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings
    goconst:
      min-occurrences: 4
  exclusions:
    rules:
      # Generated deepcopy code is not written by hand and is not reviewed as if
      # it were.
      - path: zz_generated.*\.go
        linters:
          - revive
          - gocritic

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/lpogosu/k8s-model-operator
